<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタミナタイマー</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="loadingCover">ロード中...</div>

  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔒 認証が必要です</h2>
      <p>パスコードを入力してください</p>
      <input type="password" id="passInput" placeholder="パスコード" onkeydown="if(event.key==='Enter') verifyAndLogin()">
      <button onclick="verifyAndLogin()">ロック解除</button>
      <div id="lockError" style="color: #f87171; font-size: 0.8rem; margin-top: 8px; display: none;">パスコードが違います</div>
    </div>
  </div>

  <div id="appContainer">
    <header>
      <h1>📱 スタミナタイマー</h1>
      <div class="header-actions">
        <span id="syncStatus">読込待機中</span>
        <button class="sync-btn" onclick="fetchTimers()">🔄 同期</button>
      </div>
    </header>

    <main id="timerContainer"></main>

    <button class="fab" onclick="openAddModal()" title="タイマーを追加">＋</button>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <h2 id="modalTitle">タイマー追加</h2>
        <input type="hidden" id="editIndex" value="-1">

        <div class="form-group">
          <label>ゲームタイトル</label>
          <input type="text" id="inputName">
        </div>
        <div class="form-group">
          <label>現在のスタミナ</label>
          <input type="number" id="inputCurrent">
        </div>
        <div class="form-group">
          <label>最大スタミナ</label>
          <input type="number" id="inputMax">
        </div>
        <div class="form-group">
          <label>目標スタミナ</label>
          <input type="number" id="inputTarget">
        </div>
        <div class="form-group">
          <label>回復ペース</label>
          <div class="form-row">
            <input type="number" id="inputIntervalMin" placeholder="分" value="5">
            <span>分</span>
            <input type="number" id="inputIntervalSec" placeholder="秒" value="0" min="0" max="59">
            <span>秒 / 1回復</span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-delete" id="btnDelete" onclick="deleteCurrentTimer()" style="display:none;">削除</button>
          <button type="button" class="btn-cancel" onclick="closeModal()">キャンセル</button>
          <button type="button" class="btn-save" onclick="saveModalData()">保存</button>
        </div>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
